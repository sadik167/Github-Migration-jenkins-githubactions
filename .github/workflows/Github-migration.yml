name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: github-actions-migration-role
  IMAGE_TAG: ${{github.sha}}
  
jobs:

  build-test-push:
    name: build jenkins migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      
      - name: Install dependencies
        working-directory: app
        run: npm install
          
        
      - name: Run Tests
        working-directory: app
        run: npm test
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-region: ${{env.AWS_REGION}}
          role-to-assume: arn:aws:iam::${{vars.ACCOUNT_ID}}:role/github-actions-migration-role
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        
      - name: Build docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
      
      - name: push docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          
  deploy:
    name: deploy the image to EC2
    needs: build-test-push
    runs-on: ubuntu-latest
      
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-region: ${{env.AWS_REGION}}
          role-to-assume: arn:aws:iam::${{vars.ACCOUNT_ID}}:role/github-actions-migration-role
      
      - name: Deploy to EC2 using SSM
        env:
          EC2_INSTANCE_ID: ${{vars.EC2_INSTANCE_ID}}
          REGISTRY: ${{vars.ACCOUNT_ID}}.dkr.ecr.${{env.AWS_REGION}}.amazonaws.com
        run: |
          COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$EC2_INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters commands="[
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY \,
          docker pull $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \,
          docker stop app || true \,
          docker rm app || true \,
          docker run -d --name app -p8099:8080 $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          ]" --query "Command.CommandId" --output text)
          
          echo "SSM COMMAND : $COMMAND_ID"
          
          STATUS="InProgress"
          while [[ "$STATUS" == "InProgress" || "$STATUS" == "Pending" ]]; do
            sleep 10
            STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" --query "Commands[0].Status" --output text  )
            echo "current status : $STATUS"
          done
          
          if [[ "$STATUS"! = "Success" ]]; then
            echo "SSM Deployment failed with status : $STATUS"
            aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query \
            "CommandInvocations[*].CommandPlugins[*].{Output:Output,Status:Status}" --output json
            exit 1
          fi  
          
          echo "Deployment completed successfully"
          
          
      - name: Smoke test
        env:
          EC2_PUBLIC_IP: ${{vars.EC2_PUBLIC_IP}}
        run: |
          sleep 5
          curl --fail --retry 6 --retry-delay 5 --retry-connrefused http://$EC2_PUBLIC_IP:8099/health
          echo "Smoke Test Passed!"
